<!DOCTYPE html>
<html>

<head>
    <title>KIET University Admission Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1 id="collegeName">KIET University</h1>
        <p>University Admission Form</p>

        <form>

            <h2>Personal Details</h2>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number">

            <label>Date of Birth</label>
            <input type="date">
            <label>Gender</label>
            <select>
                <option>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <h2>Academic Details</h2>

            <label>Course</label>
            <select>
                <option>Select Course</option>
                <option>B.Tech</option>
                <option>BCA</option>
                <option>BBA</option>
                <option>MCA</option>
                <option>M.Tech</option>
            </select>

            <label>12th Percentage</label>
            <input type="number" placeholder="Enter percentage">

            <label>School/College Name</label>
            <input type="text" placeholder="Enter school/college name">

            <h2>Address</h2>

            <label>Address</label>
            <textarea placeholder="Enter your complete address"></textarea>

            <label>City</label>
            <input type="text" placeholder="Enter city">

            <label>State</label>
            <input type="text" placeholder="Enter state">

            <label>Pin Code</label>
            <input type="text" placeholder="Enter pin code">

            <button type="submit">Submit Application</button>
            <button type="reset" class="reset">Reset</button>
        </form>

    </div>

</body>

</html>
